<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HILAARA | Modern Men's & Women's Fashion</title>
    <meta name="description" content="Discover refined, contemporary men's and women's fashion in Somalia. High-quality garments, mobile money payments (EVC Plus, eDahab, ZAAD), and direct fulfillment." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Instant Lightweight Preloader */
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F7F5EF;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #app-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-mark {
        width: 48px;
        height: 48px;
        animation: pulseMark 1.6s ease-in-out infinite;
      }
      .preloader-text {
        margin-top: 16px;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #77766F;
      }
      @keyframes pulseMark {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body class="bg-warm-ivory text-charcoal font-sans antialiased selection:bg-muted-olive selection:text-white">
    <!-- Instant Preloader Shell -->
    <div id="app-preloader" aria-hidden="true">
      <svg class="preloader-mark" viewBox="0 0 100 100" fill="none">
        <rect x="18" y="16" width="12" height="68" rx="2" fill="#191A17" />
        <rect x="70" y="16" width="12" height="68" rx="2" fill="#191A17" />
        <path d="M30 46 C 30 34, 70 34, 70 46 L 70 56 C 70 46, 30 46, 30 56 Z" fill="#191A17" />
        <path d="M30 48 Q 50 38 70 48" stroke="#191A17" stroke-width="4" stroke-linecap="round" />
      </svg>
      <span class="preloader-text">HILAARA</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
